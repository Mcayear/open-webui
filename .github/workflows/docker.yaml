name: Create and publish Docker images with specific build args

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags:
      - v*

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slim:
    uses: ./.github/workflows/docker-build.yaml
    permissions:
      contents: read
      packages: write
    with:
      variant: slim
      suffix: '-slim'
      build_args: USE_SLIM=true

  images:
    uses: ./.github/workflows/docker-build.yaml
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant:
          - name: main
            suffix: ''
            build_args: ''
            free_disk: false
          - name: cuda
            suffix: '-cuda'
            build_args: 'USE_CUDA=true'
            free_disk: true
          - name: cuda126
            suffix: '-cuda126'
            build_args: |
              USE_CUDA=true
              USE_CUDA_VER=cu126
            free_disk: true
          - name: ollama
            suffix: '-ollama'
            build_args: 'USE_OLLAMA=true'
            free_disk: false
    with:
      variant: ${{ matrix.variant.name }}
      suffix: ${{ matrix.variant.suffix }}
      build_args: ${{ matrix.variant.build_args }}
      free_disk: ${{ matrix.variant.free_disk }}

  notify-helm-charts:
    runs-on: ubuntu-latest
    needs: [images]
    if: ${{ !cancelled() && needs.images.result == 'success' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Create Helm charts app token
        id: helm-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HELM_CHARTS_APP_ID }}
          private-key: ${{ secrets.HELM_CHARTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: helm-charts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify published Open WebUI image
        id: image
        run: |
          set -euo pipefail

          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          ref_name="${GITHUB_REF_NAME}"

          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            image_tag="dev"
          else
            image_tag="${ref_name#v}"
          fi

          docker buildx imagetools inspect "${image_name}:${image_tag}"
          echo "tag=${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch Helm chart automation
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.helm-app-token.outputs.token }}
          script: |
            const isDev = context.ref === 'refs/heads/dev';
            const eventType = isDev
              ? 'open-webui-dev-image-published'
              : 'open-webui-release-published';
            const refName = context.ref.replace('refs/heads/', '').replace('refs/tags/', '');
            const appVersion = refName.startsWith('v') ? refName.slice(1) : refName;
            const payload = {
              image_tag: isDev ? 'dev' : appVersion,
              source_ref: context.ref,
              source_sha: context.sha,
              source_run_id: String(context.runId),
              source_repository: context.repo.repo,
            };

            if (!isDev) {
              payload.app_version = appVersion;
            }

            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: 'helm-charts',
              event_type: eventType,
              client_payload: payload,
            });
